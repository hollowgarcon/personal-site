<title>Dimas Aryo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:wght@700&display=swap">
<style>
/* Layout: full-screen painting, name pinned top left. Smoke is animated on a canvas laid over the painting. */
:root {
  --bg: #3a3a34;
  --ink: #ffffff;
  --serif: "Cormorant", Georgia, "Times New Roman", serif;
}
html, body { height: 100%; overflow: hidden; }
body {
  box-sizing: border-box;
  background: var(--bg) url("background.jpg") center / cover no-repeat;
  color: var(--ink);
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#smoke { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
h1 {
  position: relative;
  margin: 0;
  font: 700 clamp(72px, 19.2vw, 216px) / 1 var(--serif);
  letter-spacing: -0.01em;
  text-shadow: 0 2px 24px rgba(0, 0, 0, 0.35);
}
</style>

<canvas id="smoke" aria-hidden="true"></canvas>
<h1>Dimas Aryo</h1>

<script>
(function () {
  // Smoke outlines, drawn on the painting at 2000 x 1000.
  var POLYS = [
    // dark plume on the left, above the burning ship
    [[0,600],[120,585],[250,610],[380,650],[470,700],[500,760],[430,800],[330,780],[250,750],[150,725],[60,695],[0,680]],
    // dark cloud between the cliff and the statue
    [[1050,120],[1250,90],[1480,110],[1470,230],[1400,270],[1300,330],[1230,280],[1150,200],[1060,170]],
    // dark smoke over the crowd, to the left of the statue base
    [[1200,565],[1330,548],[1500,560],[1500,650],[1380,660],[1260,625]]
  ];
  var LEVELS = [0.8, 1, 1]; // motion of each outline. The right-side plumes move 25% more than the left.
  var STRENGTH = 0.025;    // how far the smoke swirls. Raise for more motion.
  var SHIMMER = 0.375;     // light and dark billowing in the smoke.
  var SPEED = 1.0;

  var canvas = document.getElementById("smoke");
  var gl = canvas.getContext("webgl", { antialias: false });
  if (!gl) { canvas.remove(); return; }

  var VS = "attribute vec2 p; varying vec2 v; void main(){ v = vec2(p.x*0.5+0.5, 0.5-p.y*0.5); gl_Position = vec4(p,0.,1.); }";
  var FS = [
    "#ifdef GL_FRAGMENT_PRECISION_HIGH", "precision highp float;", "#else", "precision mediump float;", "#endif",
    "varying vec2 v;",
    "uniform sampler2D img; uniform sampler2D mask; uniform vec2 scale; uniform float t;",
    "uniform float strength; uniform float shimmer;",
    "float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }",
    "float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);",
    "  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y); }",
    "float fbm(vec2 p){ return 0.6*n(p) + 0.3*n(p*2.03) + 0.1*n(p*4.1); }",
    "void main(){",
    "  vec2 uv = (v - 0.5) * scale + 0.5;",
    "  vec2 o = vec2(0.012, 0.024);",
    "  float m = texture2D(mask, uv).r * 0.4;",
    "  m += texture2D(mask, uv + vec2(o.x, 0.0)).r * 0.15;",
    "  m += texture2D(mask, uv - vec2(o.x, 0.0)).r * 0.15;",
    "  m += texture2D(mask, uv + vec2(0.0, o.y)).r * 0.15;",
    "  m += texture2D(mask, uv - vec2(0.0, o.y)).r * 0.15;",
    "  vec2 p = vec2(uv.x * 2.0, uv.y) * 5.0;",
    "  vec2 drift = vec2(0.0, -t * 0.12);",
    "  vec2 d = vec2(fbm(p + drift), fbm(p + vec2(7.3, 2.1) + drift * 1.1)) - 0.5;",
    "  vec3 c = texture2D(img, uv + d * strength * m).rgb;",
    "  float b = fbm(p * 0.8 + vec2(3.0, 0.0) + drift * 0.7) - 0.5;",
    "  c *= 1.0 + shimmer * m * b;",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"
  ].join("\n");

  function shader(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
  }
  var vs = shader(gl.VERTEX_SHADER, VS), fs = shader(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) { canvas.remove(); return; }
  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { canvas.remove(); return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  function texture(unit, source) {
    var tex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }

  var mc = document.createElement("canvas");
  mc.width = 256; mc.height = 128;
  var mx = mc.getContext("2d");
  mx.fillStyle = "#000"; mx.fillRect(0, 0, 256, 128);
  POLYS.forEach(function (poly, k) {
    var g = Math.round(255 * LEVELS[k]);
    mx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
    mx.beginPath();
    poly.forEach(function (pt, i) {
      var x = pt[0] * 0.128, y = pt[1] * 0.128;
      if (i) mx.lineTo(x, y); else mx.moveTo(x, y);
    });
    mx.closePath(); mx.fill();
  });

  var U = {};
  ["img", "mask", "scale", "t", "strength", "shimmer"].forEach(function (n) { U[n] = gl.getUniformLocation(prog, n); });
  var IMG_ASPECT = 2;
  var still = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, canvas.width, canvas.height);
    var a = canvas.clientWidth / canvas.clientHeight;
    gl.uniform2f(U.scale, a > IMG_ASPECT ? 1 : a / IMG_ASPECT, a > IMG_ASPECT ? IMG_ASPECT / a : 1);
  }

  function frame(ms) {
    gl.uniform1f(U.t, (ms / 1000 * SPEED) % 600);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (!still) requestAnimationFrame(frame);
  }

  var image = new Image();
  image.crossOrigin = "anonymous";
  image.onload = function () {
    texture(0, image);
    texture(1, mc);
    gl.uniform1i(U.img, 0);
    gl.uniform1i(U.mask, 1);
    gl.uniform1f(U.strength, STRENGTH);
    gl.uniform1f(U.shimmer, SHIMMER);
    IMG_ASPECT = image.naturalWidth / image.naturalHeight;
    resize();
    window.addEventListener("resize", function () { resize(); if (still) frame(0); });
    requestAnimationFrame(frame);
  };
  image.onerror = function () { canvas.remove(); };
  image.src = "background.jpg";
})();
</script>
